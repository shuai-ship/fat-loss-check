<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>减脂打卡</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto}
html,body{background:#ffffff;color:#222;font-size:16px;}
body{max-width:960px;margin:20px auto;padding:0 16px;line-height:1.6}
h1{font-size:26px;margin:16px 0}
h2{font-size:22px;margin:14px 0;border-bottom:1px solid #ccc;padding-bottom:6px}
h3{font-size:18px;margin:12px 0}
button{padding:8px 12px;border:none;border-radius:4px;background:#3b82f6;color:#fff;font-size:15px;margin:4px 0;cursor:pointer}
button.gray{background:#9ca3af}
button.green{background:#10b981}
button.orange{background:#f97316}
button.small{padding:4px 8px;font-size:14px}
input{padding:8px;border:1px solid #ccc;border-radius:4px;margin:6px 0;font-size:16px;}
select{padding:8px;border:1px solid #ccc;border-radius:4px;margin:6px 0;font-size:16px;}
.check-item{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:16px}
.progress{height:14px;background:#e5e7eb;border-radius:7px;overflow:hidden;margin:10px 0;width:100%}
.progress>div{height:100%;background:#3b82f6;width:0%}
.log-item{padding:8px;border-bottom:1px solid #eee;font-size:15px;cursor:pointer;}
.tab-wrap{margin:16px 0}
.tab-btn{margin-right:6px}
.tab-content{display:none;padding:14px;border:1px solid #ddd;border-radius:6px;margin:8px 0}
.tab-content.active{display:block}
canvas{width:100%;height:280px;margin:10px 0;border:1px solid #eee;border-radius:6px}
.countdown{background:#fef3c7;color:#92400e;padding:10px;border-radius:6px;margin:8px 0;font-weight:bold}
.set-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bmi-text{color:#2563eb;font-weight:bold;margin:6px 0;font-size:16px}
.bodyfat-text{color:#db2777;font-weight:bold;margin:6px 0;font-size:16px}
.nutri-text{color:#222;font-size:16px;margin:6px 0;line-height:1.6}
.recipe-box{background:#f0fdf4;padding:10px;border-radius:6px;margin-top:10px;font-size:15px;line-height:1.6}
.hidden{display:none;}
.tip-text{color:#666;font-size:14px;line-height:1.4}
.food-list-item{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1f1f1;font-size:15px}
.food-summary{background:#eff6ff;padding:10px;border-radius:6px;margin:10px 0;line-height:1.7;font-size:15px}
.diff-positive{color:#dc2626;font-weight:bold;}
.diff-negative{color:#16a34a;font-weight:bold;}

.modal-content{background:#fff;border-radius:8px;padding:20px;width:100%;max-width:600px;max-height:85vh;overflow-y:auto;border:1px solid #aaa}
.modal-close{float:right;border:none;background:transparent;color:#666;font-size:26px;cursor:pointer;width:auto;padding:0}
.custom-food-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee;font-size:15px}
.preview-nutri{
    color:#16a34a;
    font-weight:500;
    margin:6px 0;
    font-size:16px;
}
.match-tip{
    color:#3b82f6;
    font-size:14px;
    margin:4px 0;
}
.notfound-tip{
    color:#ef4444;
    font-size:14px;
    margin:4px 0;
}
.unit-switch-row{
    display:flex;align-items:center;gap:10px;margin:8px 0;

<body>
<h1>减脂打卡记录</h1>
<div class="tab-wrap">
<button class="tab-btn active" onclick="switchTab(0)">打卡首页</button>
<button class="tab-btn" onclick="switchTab(1)">基础设置</button>

<div class="check-item">

</div>
<div class="check-item">
<input type="checkbox" id="chkDinner"><label for="chkDinner">晚餐达标</label>
</div>
<div class="check-item">
<input type="checkbox" id="chkWater"><label for="chkWater">饮水≥2000ml</label>
</div>
<div class="check-item">

</div>

</div>
<div>

</div>
<div class="set-row">

<div>
<label>目标体重 kg</label>

</div>

<div class="set-row">
<input type="number" id="customKcal" placeholder="热量 kcal" step="0.1">
<input type="number" id="customProtein" placeholder="蛋白质g" step="0.1">
</div>
<div class="set-row">
<input type="number" id="customCarb" placeholder="碳水g" step="0.1">

<div class="food-summary" id="foodTotalSummary"></div>
<button class="gray" onclick="clearTodayFood()">清空今日食物</button>

<span class="modal-close" onclick="closeModal()">×</span>
<h3>📅 当日饮食详情</h3>
<div id="modalFoodContent"></div>
</div>
</div>

<script>
// ===================== 千焦 千卡换算函数 =====================
function kcalToKj(kcal){
    return kcal * 4.184;
}
function kjToKcal(kj){
    return kj / 4.184;
}
//获取当前选择的单位
function getEnergyUnit(){
    return document.getElementById("energyUnitSelect").value;
}
//格式化热量文本，自动切换单位
function formatEnergy(kcalNum){
    const unit = getEnergyUnit();
    if(unit === "kj"){
        const kjVal = kcalToKj(kcalNum);
        return `${kjVal.toFixed(0)} kJ`;
    }else{
        return `${kcalNum.toFixed(0)} kcal`;
    }
}

//BMI计算
function calcBMI(weight,heightCm){
const hM = heightCm / 100;return (weight/(hM*hM)).toFixed(1);
}

//体脂计算两套公式
function calcBodyFat(gender, formula, age, heightCm, weight, waistCm, neckCm, hipCm){
if(formula === "navy"){
let bf;
if(gender === "male"){
bf = 495 / (1.0324 - 0.19077 * Math.log10(waistCm - neckCm) + 0.15456 * Math.log10(heightCm)) - 450;
}else{
bf = 495 / (1.29579 - 0.35004 * Math.log10(waistCm + hipCm - neckCm) + 0.22100 * Math.log10(heightCm)) - 450;
}
return bf.toFixed(1);
}else if(formula === "deurenberg"){
const bmi = weight / Math.pow(heightCm/100, 2);
let bf;
if(gender === "male"){
bf = 1.20 * bmi + 0.23 * age - 16.2;
}else{
bf = 1.20 * bmi + 0.23 * age - 5.4;
}
return bf.toFixed(1);
}
}

//双曲线绘图：体重+体脂
function drawChart(){
const canvas = document.getElementById('chartCanvas');
if(!canvas) return;
const ctx = canvas.getContext('2d');
const containerWidth = canvas.offsetWidth;
canvas.width = containerWidth;
canvas.height = 280;
ctx.clearRect(0,0,canvas.width,canvas.height);
const validRecords = records.filter(r=>!isNaN(parseFloat(r.weight)) && !isNaN(parseFloat(r.bodyFat)));
if(validRecords.length<2){
ctx.fillStyle="#666";ctx.font="16px system-ui";ctx.textAlign="center";
ctx.fillText("至少2条打卡记录才会绘制体重&体脂曲线",containerWidth/2,140);return;
}
const weights = validRecords.map(r=>Number(r.weight));
const bodyFats = validRecords.map(r=>Number(r.bodyFat));
const minW = Math.min(...weights)-1;const maxW = Math.max(...weights)+1;
const minBF = Math.min(...bodyFats)-2;const maxBF = Math.max(...bodyFats)+2;
const count = validRecords.length;
const stepX = (containerWidth-60)/(count-1);

//体重蓝色
ctx.beginPath();ctx.strokeStyle="#3b82f6";ctx.lineWidth=2;
for(let i=0;i<count;i++){
const x = 30 + i*stepX;
const y = 30 + (maxW - weights[i])/(maxW-minW)*(280-60);
i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
}
ctx.stroke();
//体脂玫红
ctx.beginPath();ctx.strokeStyle="#db2777";ctx.lineWidth=2;
for(let i=0;i<count;i++){
const x = 30 + i*stepX;
const y = 30 + (maxBF - bodyFats[i])/(maxBF-minBF)*(280-60);
i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
}
ctx.stroke();
ctx.fillStyle="#333";ctx.font="12px system-ui";
ctx.fillText("体重(kg)",10,40);
ctx.fillStyle="#db2777";
ctx.fillText("体脂(%)",10,60);
}

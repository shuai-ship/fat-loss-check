<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>减脂打卡｜土豆+鸡胸肉食谱+食物热量计算器</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="减脂打卡">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏋️</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto}
html,body{padding:12px;background:#f7f8fa;color:#222;max-width:100%;min-height:100vh}
body{max-width:480px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #00000012;width:100%}
h2{font-size:18px;margin-bottom:10px}
h3{font-size:16px;margin:8px 0}
button{padding:9px 10px;border:none;border-radius:8px;background:#3b82f6;color:#fff;font-size:14px;margin:4px;cursor:pointer;min-height:40px}
button.gray{background:#9ca3af}
button.green{background:#10b981}
button.orange{background:#f97316}
input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:6px 0;font-size:16px}
select{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:6px 0;font-size:16px;background:#fff}
.check-item{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.progress{height:12px;background:#e5e7eb;border-radius:9px;overflow:hidden;margin:8px 0;width:100%}
.progress>div{height:100%;background:#3b82f6;width:0%}
.log-item{padding:8px;border-bottom:1px solid #eee;font-size:13px;word-break:break-all}
.tab-group{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
canvas{width:100%;height:280px;margin-top:8px;border-radius:8px;background:#fff}
.countdown{background:#fef3c7;color:#92400e;padding:10px;border-radius:8px;margin:8px 0;font-weight:bold;font-size:14px}
.set-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.bmi-text{color:#2563eb;font-weight:bold;margin:6px 0;font-size:14px}
.bodyfat-text{color:#db2777;font-weight:bold;margin:6px 0;font-size:14px}
.nutri-text{color:#222;font-size:14px;margin:4px 0;line-height:1.5}
.recipe-box{background:#f0fdf4;padding:10px;border-radius:8px;margin-top:8px;font-size:14px;line-height:1.6}
</style>
</head>
<body>
<div class="card">
<h2>⚙️ 基础信息（随时修改）</h2>
<div class="set-row">
<div>
<label>性别</label>
<select id="gender">
<option value="male">男</option>
<option value="female">女</option>
</select>
</div>
<div>
<label>身高 cm</label>
<input type="number" id="height" placeholder="例如 175" step="1">
</div>
</div>
<div class="set-row">
<div>
<label>颈围 cm</label>
<input type="number" id="neck" placeholder="例如38" step="0.1">
</div>
<div>
<label>腰围 cm</label>
<input type="number" id="waist" placeholder="例如85" step="0.1">
</div>
</div>
<div class="set-row">
<div>
<label>臀围 cm（女性必填）</label>
<input type="number" id="hip" placeholder="例如98" step="0.1">
</div>
<div>
<label>起始体重 kg</label>
<input type="number" id="startWeight" placeholder="例如105" step="0.1">
</div>
</div>
<div>
<label>目标体重 kg</label>
<input type="number" id="targetWeight" placeholder="例如70" step="0.1">
</div>
<button class="orange" onclick="saveBaseInfo()">保存基础信息，重新计算</button>
<p class="bmi-text" id="bmiBox"></p>
<p class="bodyfat-text" id="bodyFatBox"></p>
</div>

<div class="card">
<h2>🍽️ 食物热量计算器</h2>
<div class="set-row">
<div>
<label>选择食物</label>
<select id="foodSelect">
<option value="chickenBreast">鸡胸肉(生)</option>
<option value="potato">土豆(生)</option>
<option value="eggWhole">全鸡蛋</option>
<option value="broccoli">西兰花</option>
<option value="lettuce">生菜</option>
<option value="cucumber">黄瓜</option>
<option value="tomato">番茄</option>
<option value="brownRice">糙米(生)</option>
<option value="beefLean">瘦牛肉(生)</option>
<option value="shrimp">大虾(生)</option>
</select>
</div>
<div>
<label>食物克数(g)</label>
<input type="number" id="foodGram" placeholder="100" value="100" step="1">
</div>
</div>
<button class="green" onclick="calcFoodNutrition()">计算营养</button>
<div class="nutri-text" id="foodResult"></div>
</div>

<div class="card">
<h2>📋 自动生成减脂食谱</h2>
<div class="set-row">
<div>
<label>活动量</label>
<select id="activityLevel">
<option value="1.2">久坐几乎不运动</option>
<option value="1.375">轻度运动 1-3次/周</option>
<option value="1.55">中度运动 3-5次/周</option>
<option value="1.725">高强度运动 6-7次/周</option>
</select>
</div>
<div>
<label>食谱方案</label>
<select id="recipeType">
<option value="planA">方案A：土豆+鸡胸</option>
<option value="planB">方案B：糙米+瘦牛肉</option>
<option value="planC">方案C：红薯+鱼虾</option>
</select>
</div>
</div>
<button class="green" onclick="generateRecipe()">生成食谱</button>
<div class="recipe-box" id="recipeResult"></div>
</div>

<div class="card">
<h2>🎯 减脂目标</h2>
<div id="stageInfo"></div>
<div class="countdown" id="cheatCountdown"></div>
<div class="progress"><div id="progressBar"></div></div>
<p id="progressText"></p>
<div class="tab-group">
<button onclick="switchStage(1)">阶段①</button>
<button onclick="switchStage(2)">阶段②</button>
<button onclick="switchStage(3)">阶段③</button>
<button onclick="switchStage(4)">可选冲刺</button>
</div>
</div>

<div class="card">
<h3>📅 今日打卡</h3>
<div class="check-item">
<input type="checkbox" id="chkBreakfast"><label for="chkBreakfast">早餐达标</label>
</div>
<div class="check-item">
<input type="checkbox" id="chkLunch"><label for="chkLunch">午餐达标</label>
</div>
<div class="check-item">
<input type="checkbox" id="chkDinner"><label for="chkDinner">晚餐达标</label>
</div>
<div class="check-item">
<input type="checkbox" id="chkWater"><label for="chkWater">饮水≥2000ml</label>
</div>
<div class="check-item">
<input type="checkbox" id="chkTrain"><label for="chkTrain">居家力量训练完成</label>
</div>
<div class="check-item">
<input type="checkbox" id="chkCheat"><label for="chkCheat">✅放纵餐（东盛自助）</label>
</div>
<input type="number" id="weightToday" placeholder="今日空腹体重(kg)" step="0.1">
<button class="green" onclick="saveToday()">保存今日打卡</button>
<button class="gray" onclick="clearToday()">清空今日</button>
</div>

<div class="card">
<h3>📈 体重 & 体脂双曲线图（蓝=体重，玫红=体脂）</h3>
<canvas id="chartCanvas"></canvas>
</div>

<div class="card">
<h3>📖 当前阶段规则｜土豆为主食，每日生鸡胸肉300g</h3>
<div id="ruleBox"></div>
</div>

<div class="card">
<h3>📜 历史记录</h3>
<div id="logBox"></div>
<button class="gray" onclick="clearAllLog()">清空全部记录（谨慎！）</button>
</div>

<script>
//食物营养数据库（每100g）
const foodDB = {
chickenBreast:{name:"鸡胸肉(生)",kcal:110,protein:23,carb:0,fat:1},
potato:{name:"土豆(生)",kcal:77,protein:2,carb:17,fat:0.1},
eggWhole:{name:"全鸡蛋",kcal:143,protein:13,carb:1,fat:10},
broccoli:{name:"西兰花",kcal:34,protein:2.8,carb:6,fat:0.4},
lettuce:{name:"生菜",kcal:16,protein:1,carb:2.3,fat:0.2},
cucumber:{name:"黄瓜",kcal:16,protein:0.6,carb:3,fat:0.2},
tomato:{name:"番茄",kcal:18,protein:0.9,carb:3.9,fat:0.2},
brownRice:{name:"糙米(生)",kcal:345,protein:7,carb:77,fat:2.8},
beefLean:{name:"瘦牛肉(生)",kcal:125,protein:22,carb:0,fat:4},
shrimp:{name:"大虾(生)",kcal:85,protein:20,carb:0,fat:0.2}
};

const stages = {
1:{name:"阶段①：减脂前期｜1400~1550kcal｜放纵餐14天一次",cheatCycle:14,desc:`
✅每日蛋白：生鸡胸肉300g（午餐150g，晚餐150g）<br>
✅主食：土豆（全部为生重，土豆当做主食，不吃米饭面条）<br>
🍽 早餐：土豆150g + 鸡蛋2个 + 黄瓜/番茄<br>
🍽 午餐：鸡胸肉150g + 土豆200g + 大量绿叶蔬菜<br>
🍽 晚餐：鸡胸肉150g + 土豆100g + 菌菇类蔬菜<br>
✅烹饪：水煮/清蒸/空气炸锅，用油≤10g；土豆禁止油炸<br>
✅饮水≥2000ml；每周晨起空腹称重1次
`},
2:{name:"阶段②：减脂中期｜1350~1500kcal｜放纵餐21天一次",cheatCycle:21,desc:`
✅每日蛋白：生鸡胸肉300g（午餐150g，晚餐150g）<br>
✅主食：土豆（生重），碳水减少<br>
🍽 早餐：土豆120g + 鸡蛋2个 + 小番茄<br>
🍽 午餐：鸡胸肉150g + 土豆150g + 西兰花/生菜<br>
🍽 晚餐：鸡胸肉150g + 土豆80g + 冬瓜/芹菜<br>
✅少油少盐，尽量不用含糖酱料
`},
3:{name:"阶段③：减脂后期｜1300~1450kcal｜放纵餐28天一次",cheatCycle:28,desc:`
✅每日蛋白：生鸡胸肉300g（午餐150g，晚餐150g）<br>
✅主食：土豆（生重）继续减量<br>
🍽 早餐：土豆100g + 鸡蛋2个<br>
🍽 午餐：鸡胸肉150g + 土豆120g + 混合蔬菜<br>
🍽 晚餐：鸡胸肉150g + 土豆60g + 菌菇/绿叶菜<br>
✅适合体重缓慢下降阶段
`},
4:{name:"可选冲刺：精细化减脂｜放纵餐28天一次",cheatCycle:28,desc:`
✅每日蛋白：生鸡胸肉300g（午餐150g，晚餐150g）<br>
✅主食：土豆最低量，适合平台期突破<br>
🍽 早餐：土豆80g + 鸡蛋2个<br>
🍽 午餐：鸡胸肉150g + 土豆100g + 大量蔬菜<br>
🍽 晚餐：鸡胸肉150g + 土豆50g + 蔬菜<br>
⚠️重点监测：睡眠、脱发、疲劳，不适立刻上调碳水
`}
};

let currentStage = 1;
let records = JSON.parse(localStorage.getItem('fatLog')) || [];
let baseInfo = JSON.parse(localStorage.getItem('fatBaseInfo')) || {
gender:"male",
height:175,
neck:38,
waist:85,
hip:98,
startWeight:105,
targetWeight:70
};

//食物热量计算
function calcFoodNutrition(){
const foodKey = document.getElementById("foodSelect").value;
const gram = Number(document.getElementById("foodGram").value);
if(isNaN(gram)||gram<=0){document.getElementById("foodResult").innerText="请输入有效克数";return;}
const f = foodDB[foodKey];
const ratio = gram / 100;
const kcal = (f.kcal * ratio).toFixed(1);
const pro = (f.protein * ratio).toFixed(1);
const carb = (f.carb * ratio).toFixed(1);
const fat = (f.fat * ratio).toFixed(1);
document.getElementById("foodResult").innerText = `${f.name} ${gram}g｜热量:${kcal}kcal｜蛋白质:${pro}g｜碳水:${carb}g｜脂肪:${fat}g`;
}

//自动生成食谱
function generateRecipe(){
const h = Number(document.getElementById("height").value);
const w = Number(document.getElementById("weightToday").value) || baseInfo.startWeight;
const gender = baseInfo.gender;
const act = Number(document.getElementById("activityLevel").value);
const plan = document.getElementById("recipeType").value;
if(isNaN(h)||isNaN(w)){document.getElementById("recipeResult").innerText="请填写身高体重";return;}
let bmr;
if(gender==="male") bmr = 10*w + 6.25*h - 5 + 5;
else bmr = 10*w + 6.25*h -5 -161;
const tdee = bmr * act;
const targetCal = Math.round(tdee - 400);
let html = `<b>基础代谢BMR：${Math.round(bmr)} kcal｜每日消耗TDEE：${Math.round(tdee)}kcal｜减脂推荐摄入：${targetCal}kcal</b><br>`;
if(plan==="planA"){
html +=`方案A【土豆+鸡胸肉】<br>早餐：土豆150g + 鸡蛋2个 + 番茄<br>午餐：鸡胸肉150g + 土豆200g + 西兰花200g<br>晚餐：鸡胸肉150g + 土豆100g + 生菜<br>蛋白合计≈66g，碳水来自土豆，少油烹饪`;
}else if(plan==="planB"){
html +=`方案B【糙米+瘦牛肉】<br>早餐：糙米80g生 + 鸡蛋2个 + 黄瓜<br>午餐：瘦牛肉140g + 糙米100g生 + 大量青菜<br>晚餐：瘦牛肉100g + 少量菌菇蔬菜<br>适合不爱吃土豆人群`;
}else{
html +=`方案C【红薯+鱼虾】<br>早餐：红薯180g + 鸡蛋2个<br>午餐：大虾180g + 红薯150g + 西兰花<br>晚餐：鱼肉120g + 绿叶蔬菜<br>脂肪偏低，口味清淡`;
}
document.getElementById("recipeResult").innerHTML = html;
}

//保存基础信息
function saveBaseInfo(){
baseInfo.gender = document.getElementById('gender').value;
baseInfo.height = parseFloat(document.getElementById('height').value);
baseInfo.neck = parseFloat(document.getElementById('neck').value);
baseInfo.waist = parseFloat(document.getElementById('waist').value);
baseInfo.hip = parseFloat(document.getElementById('hip').value);
baseInfo.startWeight = parseFloat(document.getElementById('startWeight').value);
baseInfo.targetWeight = parseFloat(document.getElementById('targetWeight').value);
if(isNaN(baseInfo.height)||isNaN(baseInfo.neck)||isNaN(baseInfo.waist)||isNaN(baseInfo.hip)||isNaN(baseInfo.startWeight)||isNaN(baseInfo.targetWeight)){
alert('所有基础信息不能为空！女性臀围必须填写');return;
}
localStorage.setItem('fatBaseInfo',JSON.stringify(baseInfo));
alert('基础信息已更新，页面已重新计算！');render();
}

//BMI计算
function calcBMI(weight,heightCm){
const hM = heightCm / 100;return (weight/(hM*hM)).toFixed(1);
}

//海军体脂公式 男女两套
function calcBodyFat(gender, heightCm, waistCm, neckCm, hipCm){
let bf;
if(gender === "male"){
bf = 495 / (1.0324 - 0.19077 * Math.log10(waistCm - neckCm) + 0.15456 * Math.log10(heightCm)) - 450;
}else{
bf = 495 / (1.29579 - 0.35004 * Math.log10(waistCm + hipCm - neckCm) + 0.22100 * Math.log10(heightCm)) - 450;
}
return bf.toFixed(1);
}

//双曲线绘图：体重+体脂
function drawChart(){
const canvas = document.getElementById('chartCanvas');
const ctx = canvas.getContext('2d');
const containerWidth = canvas.offsetWidth;
canvas.width = containerWidth * 2;
canvas.height = 560;
ctx.scale(2,2);
const w = containerWidth;
const h = 280;
ctx.clearRect(0,0,w,h);
const validRecords = records.filter(r=>!isNaN(parseFloat(r.weight)) && !isNaN(parseFloat(r.bodyFat)));
if(validRecords.length<2){
ctx.fillStyle="#666";ctx.font="14px system-ui";ctx.textAlign="center";
ctx.fillText("至少2条打卡记录才会绘制体重&体脂曲线",w/2,h/2);return;
}
//提取数据
const dates = validRecords.map(r=>r.date);
const weights = validRecords.map(r=>Number(r.weight));
const bodyFats = validRecords.map(r=>Number(r.bodyFat));
//体重Y轴
const minW = Math.min(...weights)-1;const maxW = Math.max(...weights)+1;
//体脂Y轴
const minBF = Math.min(...bodyFats)-2;const maxBF = Math.max(...bodyFats)+2;
const count = validRecords.length;
const stepX = (w-60)/(count-1);

//绘制体重曲线蓝色
ctx.beginPath();ctx.strokeStyle="#3b82f6";ctx.lineWidth=2;
for(let i=0;i<count;i++){
const x = 30 + i*stepX;
const y = 30 + (maxW - weights[i])/(maxW-minW)*(h-60);
i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
}
ctx.stroke();

//绘制体脂曲线玫红
ctx.beginPath();ctx.strokeStyle="#db2777";ctx.lineWidth=2;
for(let i=0;i<count;i++){
const x = 30 + i*stepX;
const y = 30 + (maxBF - bodyFats[i])/(maxBF-minBF)*(h-60);
i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
}
ctx.stroke();

//坐标文字
ctx.fillStyle="#333";ctx.font="10px system-ui";
ctx.fillText("体重(kg)",10,40);
ctx.fillStyle="#db2777";
ctx.fillText("体脂(%)",10,60);
}

function renderCheatCountdown(){
const s = stages[currentStage];
const cheatRecords = records.filter(r=>r.cheat).map(r=>new Date(r.date));
if(cheatRecords.length===0){
document.getElementById('cheatCountdown').innerText=`🍖放纵餐周期：${s.cheatCycle}天｜还未记录自助，打卡勾选自助后开始倒计时`;return;
}
const lastCheat = cheatRecords.sort((a,b)=>b-a)[0];
const nextCheat = new Date(lastCheat);
nextCheat.setDate(nextCheat.getDate()+s.cheatCycle);
const now = new Date();
const diff = Math.ceil((nextCheat - now)/(1000*3600*24));
if(diff<=0){
document.getElementById('cheatCountdown').innerText="🍖可以安排自助啦！（记得控制7分饱，中午吃）";
}else{
document.getElementById('cheatCountdown').innerText=`🍖距离下次东盛自助：还有 ${diff} 天（周期${s.cheatCycle}天）`;
}
}

function render(){
document.getElementById('gender').value = baseInfo.gender;
document.getElementById('height').value = baseInfo.height;
document.getElementById('neck').value = baseInfo.neck;
document.getElementById('waist').value = baseInfo.waist;
document.getElementById('hip').value = baseInfo.hip;
document.getElementById('startWeight').value = baseInfo.startWeight;
document.getElementById('targetWeight').value = baseInfo.targetWeight;

const s = stages[currentStage];
document.getElementById('stageInfo').innerText = s.name;
document.getElementById('ruleBox').innerHTML = s.desc;
renderCheatCountdown();

const lastW = records.length ? records[records.length-1].weight : baseInfo.startWeight;
const bmi = calcBMI(lastW, baseInfo.height);
document.getElementById('bmiBox').innerText = `当前BMI：${bmi}`;
const bodyFatVal = calcBodyFat(baseInfo.gender, baseInfo.height, baseInfo.waist, baseInfo.neck, baseInfo.hip);
document.getElementById('bodyFatBox').innerText = `估算体脂率：${bodyFatVal}%（仅参考，非专业仪器测量）`;

const totalReduce = baseInfo.startWeight - baseInfo.targetWeight;
const doneReduce = baseInfo.startWeight - lastW;
const pct = totalReduce <= 0 ? 0 : Math.max(0,Math.min(100, doneReduce/totalReduce*100)).toFixed(1);
document.getElementById('progressBar').style.width = pct+'%';
document.getElementById('progressText').innerText=`当前${lastW}kg，目标${baseInfo.targetWeight}kg，总减重进度${pct}%`;
document.getElementById('logBox').innerHTML = records.slice(-10).reverse().map(r=>`
<div class="log-item">${r.date}｜体重${r.weight}kg｜估算体脂${r.bodyFat}%｜早餐${r.food?'✅':'❌'}｜训练${r.train?'✅':'❌'}｜自助${r.cheat?'🍖':'❌'}</div>`).join('');
drawChart();
}
function switchStage(n){currentStage=n;render();}
function saveToday(){
const w = parseFloat(document.getElementById('weightToday').value);
if(isNaN(w)){alert('请填写体重');return;}
const bodyFatNow = calcBodyFat(baseInfo.gender, baseInfo.height, baseInfo.waist, baseInfo.neck, baseInfo.hip);
const rec = {
date:new Date().toLocaleDateString(),weight:w,bodyFat:bodyFatNow,

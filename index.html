<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>减脂打卡工具</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="减脂打卡">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏋️</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto}
html,body{padding:12px;background:#f7f8fa;color:#222}
body{max-width:720px;margin:0 auto}

/* Tab导航样式 - 修改文字为黑色 */
.tab-nav{display:flex;gap:4px;margin-bottom:12px;background:#fff;border-radius:12px;padding:4px;box-shadow:0 1px 4px #00000012}
.tab-btn{flex:1;padding:12px 6px;border:none;border-radius:10px;background:transparent;font-size:14px;font-weight:500;cursor:pointer;transition:0.2s;color:#000 !important;}
.tab-btn.active{background:#3b82f6;color:#fff !important;}

/* 卡片通用 */
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px #00000012}
h2{font-size:18px;margin-bottom:12px}
h3{font-size:16px;margin:8px 0}
button{padding:10px 12px;border:none;border-radius:8px;background:#3b82f6;color:#fff;font-size:14px;margin:4px;cursor:pointer;min-height:42px}
button.gray{background:#9ca3af}
button.green{background:#10b981}
button.orange{background:#f97316}
input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:6px 0;font-size:16px}
select{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:6px 0;font-size:14px;background:#fff}
#bfFormula{font-size:13px;}
.check-item{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:14px}
.progress{height:12px;background:#e5e7eb;border-radius:9px;overflow:hidden;margin:10px 0}
.progress>div{height:100%;background:#3b82f6;width:0%}
.log-item{padding:8px;border-bottom:1px solid #eee;font-size:13px;word-break:break-all;cursor:pointer;}
.log-item:hover{background:#f6f8ff}
.tab-content{display:none}
.tab-content.active{display:block}
canvas{width:100%;height:280px;margin-top:8px;border-radius:8px;background:#fff}
.countdown{background:#fef3c7;color:#92400e;padding:12px;border-radius:8px;margin:8px 0;font-weight:bold;font-size:14px}
.set-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bmi-text{color:#2563eb;font-weight:bold;margin:6px 0;font-size:14px}
.bodyfat-text{color:#db2777;font-weight:bold;margin:6px 0;font-size:14px}
.nutri-text{color:#222;font-size:14px;margin:6px 0;line-height:1.5}
.recipe-box{background:#f0fdf4;padding:12px;border-radius:8px;margin-top:10px;font-size:14px;line-height:1.6}
.hidden{display:none;}
.tip-text{color:#666;font-size:13px;line-height:1.4}
.food-list-item{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid #f1f1f1;font-size:14px}
.food-summary{background:#eff6ff;padding:12px;border-radius:8px;margin:10px 0;line-height:1.6}
.diff-positive{color:#dc2626;font-weight:bold;}
.diff-negative{color:#16a34a;font-weight:bold;}
/* 历史记录弹窗 */
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;z-index:99;align-items:center;justify-content:center;padding:16px}
.modal-content{background:#fff;border-radius:12px;padding:16px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto}
.modal-close{float:right;border:none;background:transparent;color:#666;font-size:24px;cursor:pointer}
/* 自定义食物管理列表 */
.custom-food-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #eee}
.preview-nutri{
    color:#16a34a;
    font-weight:500;
    margin:8px 0;
}
</style>
</head>
<body>
<!-- Tab导航 -->
<div class="tab-nav">
<button class="tab-btn active" onclick="switchTab(0)">📌 打卡首页</button>
<button class="tab-btn" onclick="switchTab(1)">⚙️ 基础设置</button>
<button class="tab-btn" onclick="switchTab(2)">🍽️ 食物&食谱</button>
</div>

<!-- Tab0：打卡首页 -->
<div id="tab0" class="tab-content active">
<div class="card">
<h2>🎯 减脂目标</h2>
<div id="stageInfo"></div>
<div class="countdown" id="cheatCountdown"></div>
<div class="progress"><div id="progressBar"></div></div>
<p id="progressText"></p>
<div class="set-row">
<button onclick="switchStage(1)">阶段①</button>
<button onclick="switchStage(2)">阶段②</button>
<button onclick="switchStage(3)">阶段③</button>
<button onclick="switchStage(4)">冲刺阶段</button>
</div>
</div>

<div class="card">
<h3>📅 今日打卡</h3>
<div class="check-item">
<input type="checkbox" id="chkBreakfast"><label for="chkBreakfast">早餐达标</label>
</div>
<div class="check-item">
<input type="checkbox" id="chkLunch"><label for="chkLunch">午餐达标</label>
</div>
<div class="check-item">
<input type="checkbox" id="chkDinner"><label for="chkDinner">晚餐达标</label>
</div>
<div class="check-item">
<input type="checkbox" id="chkWater"><label for="chkWater">饮水≥2000ml</label>
</div>
<div class="check-item">
<input type="checkbox" id="chkTrain"><label for="chkTrain">居家力量训练完成</label>
</div>
<div class="check-item">
<input type="checkbox" id="chkCheat"><label for="chkCheat">✅放纵餐（东盛自助）</label>
</div>
<input type="number" id="weightToday" placeholder="今日空腹体重(kg)" step="0.1">
<button class="green" onclick="saveToday()">保存今日打卡</button>
<button class="gray" onclick="clearToday()">清空今日</button>
</div>

<div class="card">
<h3>📈 体重 & 体脂双曲线图（蓝=体重，玫红=体脂）</h3>
<canvas id="chartCanvas"></canvas>
</div>

<div class="card">
<h3>📖 当前阶段规则｜土豆为主食，每日生鸡胸肉300g</h3>
<div id="ruleBox"></div>
</div>

<div class="card">
<h3>📜 历史打卡记录（点击条目查看当日饮食）</h3>
<div id="logBox"></div>
<button class="gray" onclick="clearAllLog()">清空全部记录（谨慎！）</button>
</div>
</div>

<!-- Tab1：基础设置 个人信息、体脂公式、目标热量+三大营养素目标 -->
<div id="tab1" class="tab-content">
<div class="card">
<h2>⚙️ 个人基础信息 & 体脂公式</h2>
<div class="set-row">
<div>
<label>性别</label>
<select id="gender">
<option value="male">男</option>
<option value="female">女</option>
</select>
</div>
<div>
<label>体脂计算公式</label>
<select id="bfFormula">
<option value="navy">美国海军公式（精度高，女生需臀围）</option>
<option value="deurenberg">Deurenberg简易公式（无需臀围颈围）</option>
</select>
</div>
</div>
<div class="set-row">
<div>
<label>年龄</label>
<input type="number" id="age" placeholder="28" step="1">
</div>
<div>
<label>身高 cm</label>
<input type="number" id="height" placeholder="162" step="1">
</div>
</div>
<div id="navyInputs">
<div class="set-row">
<div>
<label>颈围 cm</label>
<input type="number" id="neck" placeholder="32" step="0.1">
</div>
<div>
<label>腰围 cm</label>
<input type="number" id="waist" placeholder="70" step="0.1">
</div>
</div>
<div class="set-row">
<div>
<label>臀围 cm（女生海军公式必填）</label>
<input type="number" id="hip" placeholder="92" step="0.1">
</div>
<div>
<label>起始体重 kg</label>
<input type="number" id="startWeight" placeholder="65" step="0.1">
</div>
</div>
<div>
<label>目标体重 kg</label>
<input type="number" id="targetWeight" placeholder="52" step="0.1">
</div>
<!-- 热量+三大营养素目标 -->
<div>
<label>每日目标摄入热量(kcal)</label>
<input type="number" id="targetCalories" placeholder="1450" step="10">
</div>
<div class="set-row">
<div>
<label>目标蛋白质(g)</label>
<input type="number" id="targetProtein" placeholder="120" step="1">
</div>
<div>
<label>目标碳水(g)</label>
<input type="number" id="targetCarb" placeholder="150" step="1">
</div>
</div>
<div>
<label>目标脂肪(g)</label>
<input type="number" id="targetFat" placeholder="45" step="1">
</div>
<p class="tip-text">💡简易公式：不知道臀围的女生推荐选择，仅需要年龄、身高、体重，估算精度略低</p>
<button class="orange" onclick="saveBaseInfo()">保存基础信息</button>
<p class="bmi-text" id="bmiBox"></p>
<p class="bodyfat-text" id="bodyFatBox"></p>
</div>
</div>
</div>

<!-- Tab2：食物&食谱｜自定义食物录入+管理删除+今日食物录入+热量+三大营养素对比 -->
<div id="tab2" class="tab-content">
<div class="card">
<h2>🍽️ 食物热量计算器</h2>
<div class="set-row">
<div>
<label>选择食物</label>
<select id="foodSelect">
<!-- 选项由JS动态渲染（内置库+自定义食物） -->
</select>
</div>
<div>
<label>食物克数(g)</label>
<input type="number" id="foodGram" placeholder="100" value="100" step="1">
</div>
</div>
<button class="green" onclick="calcFoodNutrition()">计算营养</button>
<button onclick="addFoodToToday()">➕ 添加到今日食物清单</button>
<div class="nutri-text" id="foodResult"></div>
</div>

<!-- 【新增】自定义食物录入卡片 -->
<div class="card">
<h3>➕ 添加自定义食物（每100g营养）</h3>
<input type="text" id="customFoodName" placeholder="食物名称，例：全麦面包">
<div class="set-row">
<input type="number" id="customKcal" placeholder="热量kcal" step="0.1">
<input type="number" id="customProtein" placeholder="蛋白质g" step="0.1">
</div>
<div class="set-row">
<input type="number" id="customCarb" placeholder="碳水g" step="0.1">
<input type="number" id="customFat" placeholder="脂肪g" step="0.1">
</div>
<!-- 实时预览区域 -->
<div id="autoPreview" class="preview-nutri"></div>
<button onclick="addCustomFood()">保存到我的食物库</button>
<div id="customFoodTip" class="tip-text"></div>
</div>
<!-- 自定义食物列表+删除 -->
<div class="card">
<h3>📋 我的自定义食物库（可删除）</h3>
<div id="customFoodListBox"></div>
</div>

<div class="card">
<h3>📝 今日食物录入清单</h3>
<div id="todayFoodList"></div>
<div class="food-summary" id="foodTotalSummary"></div>
<button class="gray" onclick="clearTodayFood()">清空今日食物</button>
</div>

<div class="card">
<h2>📋 自动生成减脂食谱</h2>
<div class="set-row">
<div>
<label>活动量</label>
<select id="activityLevel">
<option value="1.2">久坐几乎不运动</option>
<option value="1.375">轻度运动 1-3次/周</option>
<option value="1.55">中度运动 3-5次/周</option>
<option value="1.725">高强度运动 6-7次/周</option>
</select>
</div>
<div>
<label>食谱方案</label>
<select id="recipeType">
<option value="planA">方案A：土豆+鸡胸</option>
<option value="planB">方案B：糙米+瘦牛肉</option>
<option value="planC">方案C：红薯+鱼虾</option>
</select>
</div>
</div>
<button class="green" onclick="generateRecipe()">生成食谱</button>
<div class="recipe-box" id="recipeResult"></div>
</div>
</div>

<!-- 弹窗：查看历史当日饮食 -->
<div class="modal" id="foodModal">
<div class="modal-content">
<span class="modal-close" onclick="closeModal()">×</span>
<h3>📅 当日饮食详情</h3>
<div id="modalFoodContent"></div>
</div>
</div>

<script>
//内置食物营养数据库【每100g】
const defaultFoodDB = {
chickenBreast:{name:"鸡胸肉(生)",kcal:110,protein:23,carb:0,fat:1},
potato:{name:"土豆(生)",kcal:77,protein:2,carb:17,fat:0.1},
eggWhole:{name:"全鸡蛋",kcal:143,protein:13,carb:1,fat:10},
eggWhite:{name:"蛋清",kcal:60,protein:11,carb:1,fat:0.1},
broccoli:{name:"西兰花",kcal:34,protein:2.8,carb:6,fat:0.4},
lettuce:{name:"生菜",kcal:16,protein:1,carb:2.3,fat:0.2},
cucumber:{name:"黄瓜",kcal:16,protein:0.6,carb:3,fat:0.2},
tomato:{name:"番茄",kcal:18,protein:0.9,carb:3.9,fat:0.2},
brownRice:{name:"糙米(生)",kcal:345,protein:7,carb:77,fat:2.8},
sweetPotato:{name:"红薯(生)",kcal:86,protein:1.6,carb:20,fat:0.1},
beefLean:{name:"瘦牛肉(生)",kcal:125,protein:22,carb:0,fat:4},
shrimp:{name:"大虾(生)",kcal:85,protein:20,carb:0,fat:0.2},
cod:{name:"鳕鱼",kcal:82,protein:18,carb:0,fat:1},
oatRaw:{name:"燕麦（干）",kcal:389,protein:13,carb:66,fat:7},
greekYogurt:{name:"无糖希腊酸奶",kcal:70,protein:10,carb:3,fat:0},
oliveOil:{name:"橄榄油",kcal:898,protein:0,carb:0,fat:99.8},
mushroom:{name:"香菇",kcal:26,protein:2.2,carb:4.1,fat:0.3},
spinach:{name:"菠菜",kcal:28,protein:2.9,carb:3.6,fat:0.4},
apple:{name:"苹果",kcal:52,protein:0.3,carb:14,fat:0.2},
banana:{name:"香蕉",kcal:91,protein:1.1,carb:23,fat:0.3}
};

const stages = {
1:{name:"阶段①：减脂前期｜1400~1550kcal｜放纵餐14天一次",cheatCycle:14,desc:`
✅每日蛋白：生鸡胸肉300g（午餐150g，晚餐150g）<br>
✅主食：土豆（全部为生重，土豆当做主食，不吃米饭面条）<br>
🍽 早餐：土豆150g + 鸡蛋2个 + 黄瓜/番茄<br>
🍽 午餐：鸡胸肉150g + 土豆200g + 大量绿叶蔬菜<br>
🍽 晚餐：鸡胸肉150g + 土豆100g + 菌菇类蔬菜<br>
✅烹饪：水煮/清蒸/空气炸锅，用油≤10g；土豆禁止油炸<br>
✅饮水≥2000ml；每周晨起空腹称重1次
`},
2:{name:"阶段②：减脂中期｜1350~1500kcal｜放纵餐21天一次",cheatCycle:21,desc:`
✅每日蛋白：生鸡胸肉300g（午餐150g，晚餐150g）<br>
✅主食：土豆（生重），碳水减少<br>
🍽 早餐：土豆120g + 鸡蛋2个 + 小番茄<br>
🍽 午餐：鸡胸肉150g + 土豆150g + 西兰花/生菜<br>
🍽 晚餐：鸡胸肉150g + 土豆80g + 冬瓜/芹菜<br>
✅少油少盐，尽量不用含糖酱料
`},
3:{name:"阶段③：减脂后期｜1300~1450kcal｜放纵餐28天一次",cheatCycle:28,desc:`
✅每日蛋白：生鸡胸肉300g（午餐150g，晚餐150g）<br>
✅主食：土豆（生重）继续减量<br>
🍽 早餐：土豆100g + 鸡蛋2个<br>
🍽 午餐：鸡胸肉150g + 土豆120g + 混合蔬菜<br>
🍽 晚餐：鸡胸肉150g + 土豆60g + 菌菇/绿叶菜<br>
✅适合体重缓慢下降阶段
`},
4:{name:"可选冲刺：精细化减脂｜放纵餐28天一次",cheatCycle:28,desc:`
✅每日蛋白：生鸡胸肉300g（午餐150g，晚餐150g）<br>
✅主食：土豆最低量，适合平台期突破<br>
🍽 早餐：土豆80g + 鸡蛋2个<br>
🍽 午餐：鸡胸肉150g + 土豆100g + 大量蔬菜<br>
🍽 晚餐：鸡胸肉150g + 土豆50g + 蔬菜<br>
⚠️重点监测：睡眠、脱发、疲劳，不适立刻上调碳水
`}
};

let currentStage = 1;
let records = JSON.parse(localStorage.getItem('fatLog')) || [];
let baseInfo = JSON.parse(localStorage.getItem('fatBaseInfo')) || {
gender:"female",
bfFormula:"deurenberg",
age:28,
height:162,
neck:32,
waist:70,
hip:92,
startWeight:65,
targetWeight:52,
targetCalories:1450,
targetProtein:120,
targetCarb:150,
targetFat:45
};
let todayFoodList = JSON.parse(localStorage.getItem('todayFoodList')) || [];
//自定义食物库
let customFoodDB = JSON.parse(localStorage.getItem('customFoodDB')) || {};

//合并内置+自定义食物库
function getAllFoodDB(){
  return {...defaultFoodDB, ...customFoodDB};
}
//渲染食物下拉选项
function renderFoodSelect(){
  const foodSelect = document.getElementById("foodSelect");
  foodSelect.innerHTML = "";
  const allFood = getAllFoodDB();
  Object.keys(allFood).forEach(key=>{
    const f = allFood[key];
    const opt = document.createElement("option");
    opt.value = key;
    opt.innerText = f.name;
    foodSelect.appendChild(opt);
  })
}

//【新增】实时预览自定义食物100g营养
function autoPreviewCustomFood(){
    const kcal = Number(document.getElementById("customKcal").value);
    const pro = Number(document.getElementById("customProtein").value);
    const carb = Number(document.getElementById("customCarb").value);
    const fat = Number(document.getElementById("customFat").value);
    const previewBox = document.getElementById("autoPreview");

    if(isNaN(kcal) && isNaN(pro) && isNaN(carb) && isNaN(fat)){
        previewBox.innerText = "";
        return;
    }
    previewBox.innerText = `✅100g预览：${kcal||0} kcal｜蛋白质 ${pro||0}g｜碳水 ${carb||0}g｜脂肪 ${fat||0}g`;
}

//添加自定义食物
function addCustomFood(){
  const name = document.getElementById("customFoodName").value.trim();
  const kcal = Number(document.getElementById("customKcal").value);
  const pro = Number(document.getElementById("customProtein").value);
  const carb = Number(document.getElementById("customCarb").value);
  const fat = Number(document.getElementById("customFat").value);
  if(!name || isNaN(kcal)||isNaN(pro)||isNaN(carb)||isNaN(fat)){
    document.getElementById("customFoodTip").innerText="请完整填写名称和四项营养数值";
    return;
  }
  //生成唯一key
  const key = "cus_"+Date.now();
  customFoodDB[key] = {
    name:name,
    kcal:kcal,
    protein:pro,
    carb:carb,
    fat:fat
  };
  localStorage.setItem("customFoodDB",JSON.stringify(customFoodDB));
  renderFoodSelect();
  renderCustomFoodList();
  document.getElementById("customFoodTip").innerText=`✅【${name}】已存入食物库，下拉框可以直接选择！`;
  //清空输入框 + 清空预览
  document.getElementById("customFoodName").value="";
  document.getElementById("customKcal").value="";
  document.getElementById("customProtein").value="";
  document.getElementById("customCarb").value="";
  document.getElementById("customFat").value="";
  document.getElementById("autoPreview").innerText="";
}
//渲染自定义食物列表，支持删除
function renderCustomFoodList(){
  const box = document.getElementById("customFoodListBox");
  let html = "";
  Object.entries(customFoodDB).forEach(([key,item])=>{
    html += `<div class="custom-food-row">
<span>${item.name}｜每100g：${item.kcal}kcal 蛋白${item.protein}g 碳水${item.carb}g 脂肪${item.fat}g</span>
<button style="padding:4px 6px;min-height:30px;background:#dc2626" onclick="delCustomFood('${key}')">删除</button>
</div>`;
  })

//食物热量计算
function calcFoodNutrition(){
const foodKey = document.getElementById("foodSelect").value;
const gram = Number(document.getElementById("foodGram").value);
if(isNaN(gram)||gram<=0){document.getElementById("foodResult").innerText="请输入有效克数";return;}
const f = getAllFoodDB()[foodKey];
const ratio = gram / 100;
const kcal = (f.kcal * ratio).toFixed(1);
const pro = (f.protein * ratio).toFixed(1);
const carb = (f.carb * ratio).toFixed(1);
const fat = (f.fat * ratio).toFixed(1);
document.getElementById("foodResult").innerText = `${f.name} ${gram}g｜热量:${kcal}kcal｜蛋白质:${pro}g｜碳水:${carb}g｜脂肪:${fat}g`;
}

function renderTodayFood(){

todayFoodList.forEach((item,idx)=>{
html += `<div class="food-list-item">

totalCarb += item.carb;
totalFat += item.fat;
})

//目标热量与三大营养素

const targetPro = Number(baseInfo.targetProtein) ||120;
const targetCar = Number(baseInfo.targetCarb) ||150;
const targetFt = Number(baseInfo.targetFat) ||45;

const diffKcal = totalKcal - targetCal;
const diffPro = totalPro - targetPro;
const diffCar = totalCarb - targetCar;
const diffFt = totalFat - targetFt;

function getDiffHtml(diff){
  if(diff>0) return `<span class="diff-positive">超出${diff.toFixed(1)}</span>`;
  else return `<span class="diff-negative">少${Math.abs(diff).toFixed(1)}</span>`;
}

document.getElementById('foodTotalSummary').innerHTML =
`<b>🍱今日全天汇总</b><br>
热量｜目标：${targetCal} kcal，实际：${totalKcal.toFixed(1)} kcal，差值：${getDiffHtml(diffKcal)}<br>
蛋白质｜目标：${targetPro} g，实际：${totalPro.toFixed(1)} g，差值：${getDiffHtml(diffPro)}<br>
碳水｜目标：${targetCar} g，实际：${totalCarb.toFixed(1)} g，差值：${getDiffHtml(diffCar)}<br>
脂肪｜目标：${targetFt} g，实际：${totalFat.toFixed(1)} g，差值：${getDiffHtml(diffFt)}`;
}

//自动生成食谱
function generateRecipe(){
const h = Number(document.getElementById("height").value);
const w = Number(document.getElementById("weightToday").value) || baseInfo.startWeight;

const act = Number(document.getElementById("activityLevel").value);

if(isNaN(h)||isNaN(w)){document.getElementById("recipeResult").innerText="请填写身高体重";return;}
let bmr;
if(gender==="male") bmr = 10*w + 6.25*h - 5 + 5;
else bmr = 10*w + 6.25*h -5 -161;
const tdee = bmr * act;
const targetCal = Math.round(tdee - 400);
let html = `<b>基础代谢BMR：${Math.round(bmr)} kcal｜每日消耗TDEE：${Math.round(tdee)}kcal｜减脂推荐摄入：${targetCal}kcal</b><br>`;
if(plan==="planA"){
html +=`方案A【土豆+鸡胸肉】<br>早餐：土豆150g + 鸡蛋2个 + 番茄<br>午餐：鸡胸肉150g + 土豆200g + 西兰花200g<br>晚餐：鸡胸肉150g + 土豆100g + 生菜<br>蛋白合计≈66g，碳水来自土豆，少油烹饪`;
}else if(plan==="planB"){

}else{

}

//BMI计算
function calcBMI(weight,heightCm){
const hM = heightCm / 100;return (weight/(hM*hM)).toFixed(1);
}

//体脂计算两套公式
function calcBodyFat(gender, formula, age, heightCm, weight, waistCm, neckCm, hipCm){
if(formula === "navy"){
let bf;
if(gender === "male"){
bf = 495 / (1.0324 - 0.19077 * Math.log10(waistCm - neckCm) + 0.15456 * Math.log10(heightCm)) - 450;
}else{
bf = 495 / (1.29579 - 0.35004 * Math.log10(waistCm + hipCm - neckCm) + 0.22100 * Math.log10(heightCm)) - 450;
}
return bf.toFixed(1);
}else if(formula === "deurenberg"){
const bmi = weight / Math.pow(heightCm/100, 2);
let bf;
if(gender === "male"){
bf = 1.20 * bmi + 0.23 * age - 16.2;
}else{
bf = 1.20 * bmi + 0.23 * age - 5.4;
}
return bf.toFixed(1);
}
}

//双曲线绘图：体重+体脂
function drawChart(){
const canvas = document.getElementById('chartCanvas');
if(!canvas) return;
const ctx = canvas.getContext('2d');
const containerWidth = canvas.offsetWidth;
canvas.width = containerWidth;
canvas.height = 280;
ctx.clearRect(0,0,canvas.width,canvas.height);
const validRecords = records.filter(r=>!isNaN(parseFloat(r.weight)) && !isNaN(parseFloat(r.bodyFat)));
if(validRecords.length<2){
ctx.fillStyle="#666";ctx.font="14px system-ui";ctx.textAlign="center";
ctx.fillText("至少2条打卡记录才会绘制体重&体脂曲线",containerWidth/2,140);return;
}
const weights = validRecords.map(r=>Number(r.weight));
const bodyFats = validRecords.map(r=>Number(r.bodyFat));
const minW = Math.min(...weights)-1;const maxW = Math.max(...weights)+1;
const minBF = Math.min(...bodyFats)-2;const maxBF = Math.max(...bodyFats)+2;
const count = validRecords.length;
const stepX = (containerWidth-60)/(count-1);

//体重蓝色
ctx.beginPath();ctx.strokeStyle="#3b82f6";ctx.lineWidth=2;
for(let i=0;i<count;i++){
const x = 30 + i*stepX;
const y = 30 + (maxW - weights[i])/(maxW-minW)*(280-60);
i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
}
ctx.stroke();
//体脂玫红
ctx.beginPath();ctx.strokeStyle="#db2777";ctx.lineWidth=2;
for(let i=0;i<count;i++){
const x = 30 + i*stepX;
const y = 30 + (maxBF - bodyFats[i])/(maxBF-minBF)*(280-60);
i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
}
ctx.stroke();
ctx.fillStyle="#333";ctx.font="10px system-ui";
ctx.fillText("体重(kg)",10,40);
ctx.fillStyle="#db2777";
ctx.fillText("体脂(%)",10,60);
}

function renderCheatCountdown(){
const s = stages[currentStage];
const cheatRecords = records.filter(r=>r.cheat).map(r=>new Date(r.date));
if(cheatRecords.length===0){
document.getElementById('cheatCountdown').innerText=`🍖放纵餐周期：${s.cheatCycle}天｜还未记录自助，打卡勾选自助后开始倒计时`;return;
}
const lastCheat = cheatRecords.sort((a,b)=>b-a)[0];
const nextCheat = new Date(lastCheat);
nextCheat.setDate(nextCheat.getDate()+s.cheatCycle);
const now = new Date();
const diff = Math.ceil((nextCheat - now)/(1000*3600*24));
if(diff<=0){
document.getElementById('cheatCountdown').innerText="🍖可以安排自助啦！（记得控制7分饱，中午吃）";
}else{
document.getElementById('cheatCountdown').innerText=`🍖距离下次东盛自助：还有 ${diff} 天（周期${s.cheatCycle}天）`;
}
}

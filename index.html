<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>减脂打卡工具</title>
<style>
*{box-sizing:border-box;font-family:system-ui, sans-serif;}
body{margin:10px;max-width:800px;margin:0 auto;padding:10px;}
.tab-wrap{display:flex;margin-bottom:10px;}
.tab-btn{flex:1;padding:12px;border:none;background:#fff;border-bottom:2px solid #eee;font-size:16px;color:#000;cursor:pointer;font-weight:bold;}
.tab-btn.active{border-bottom-color:#2277dd;color:#2277dd;}
.tab-panel{display:none;padding:10px 0;}
.tab-panel.active{display:block;}
.card{border:1px solid #ddd;border-radius:10px;padding:14px;margin-bottom:12px;}
input,select,button{width:100%;padding:8px;margin:6px 0;font-size:16px;}
button{background:#2277dd;color:#fff;border:none;border-radius:6px;cursor:pointer;}
button.del{background:#dd3333;}
button.green{background:#199444;}
.row{display:flex;gap:8px;}
.row>input{flex:1;}
pre{white-space:pre-wrap;}
.history-item{padding:8px;border:1px solid #ccc;border-radius:6px;margin:6px 0;cursor:pointer;}
.chartBox{height:260px;border:1px solid #ddd;border-radius:8px;padding:8px;margin:10px 0;}
small{color:#666;font-size:13px;}
</style>
</head>
<body>
<div class="tab-wrap">
  <button class="tab-btn active" data-tab="tab1">首页打卡</button>
  <button class="tab-btn" data-tab="tab2">基础设置</button>
  <button class="tab-btn" data-tab="tab3">食物&热量</button>
</div>

<!-- ========== 首页打卡 tab1 ========== -->
<div id="tab1" class="tab-panel active">
  <div class="card">
    <h3>今日打卡</h3>
    <div class="row">
      <input type="number" id="todayWeight" placeholder="今日体重kg" step="0.01">
      <input type="number" id="todayWaist" placeholder="腰围cm">
    </div>
    <label><input type="checkbox" id="isTrainDay"> 今日为力量训练日</label>
    <div id="trainCheckList">
      <p>居家训练打卡：</p>
      <label><input type="checkbox">热身10分钟</label>
      <label><input type="checkbox">靠墙静蹲3×30s</label>
      <label><input type="checkbox">椅上臀桥4×12</label>
      <label><input type="checkbox">跪姿俯卧撑3×力竭</label>
      <label><input type="checkbox">俯身划船4×12</label>
      <label><input type="checkbox">平板支撑3×20~30s</label>
      <label><input type="checkbox">拉伸放松10分钟</label>
    </div>
    <input type="number" id="waterToday" placeholder="今日饮水量 ml">
    <button onclick="saveDayRecord()">保存今日打卡</button>
  </div>
  <div class="card">
    <h3>今日食物录入</h3>
    <div class="row">
      <input id="foodName" placeholder="食物名称">
      <input id="foodGram" type="number" placeholder="克数">
    </div>
    <button onclick="addFoodItem()">添加到今日食物</button>
    <div id="todayFoodList"></div>
    <div id="macroSummary"></div>
  </div>
  <div class="card">
    <h3>历史打卡记录（点击展开详情）</h3>
    <div id="historyList"></div>
  </div>
  <div class="chartBox">
    <canvas id="weightChart"></canvas>
  </div>
</div>

<!-- ========== 基础设置 tab2 ========== -->
<div id="tab2" class="tab-panel">
  <div class="card">
    <h3>个人基础信息 & 体脂计算</h3>
    <div class="row">
      <input type="number" id="setHeight" placeholder="身高cm">
      <input type="number" id="setWeight" placeholder="体重kg">
    </div>
    <div class="row">
      <input type="number" id="setWaist" placeholder="腰围cm">
      <select id="genderSelect">
        <option value="male">男</option>
        <option value="female">女</option>
      </select>
    </div>
    <select id="fatFormula">
      <option value="navy">海军体脂公式(需臀围)</option>
      <option value="bmiEst">简易BMI估算(无需臀围)</option>
    </select>
    <input type="number" id="hipInput" placeholder="臀围cm（简易公式可不填）">
    <button onclick="calcBmiFat()">计算BMI & 估算体脂</button>
    <div id="bmiFatResult"></div>
  </div>

  <div class="card">
    <h3>三大营养素目标</h3>
    <div class="row">
      <input type="number" id="targetPro" placeholder="蛋白质目标 g">
      <input type="number" id="targetCho" placeholder="碳水目标 g">
      <input type="number" id="targetFat" placeholder="脂肪目标 g">
    </div>
    <button onclick="saveMacroTarget()">保存宏量目标</button>
    <small>训练日会自动切换碳水+15g</small>
  </div>

  <div class="card">
    <h3>📋 自动生成7天食谱+训练计划（按BMI自动匹配）</h3>
    <div>
      <label>性别：</label>
      <select id="genAuto">
        <option value="male">男</option>
        <option value="female">女</option>
      </select>
    </div>
    <div>
      <label>身高cm：</label>
      <input type="number" id="heightAuto" placeholder="输入身高">
    </div>
    <div>
      <label>体重kg：</label>
      <input type="number" id="weightAuto" placeholder="输入体重">
    </div>
    <div>
      <label>年龄：</label>
      <input type="number" id="ageAuto" placeholder="年龄">
    </div>
    <div>
      <label>活动类型：</label>
      <select id="actAuto">
        <option value="1.3">久坐通勤（几乎不运动）</option>
        <option value="1.45">通勤+每周规律力量训练</option>
      </select>
    </div>
    <button onclick="calcAutoPlan()" style="margin-top:8px;">一键生成计划</button>
    <div id="planResult" style="margin-top:12px;white-space:pre-line;"></div>
    <button class="green" onclick="applyPlanMacro()" style="margin-top:8px;">应用这套营养素目标</button>
  </div>
</div>

<!-- ========== 食物热量tab3 ========== -->
<div id="tab3" class="tab-panel">
  <div class="card">
    <h3>食物库搜索</h3>
    <input id="searchFood" placeholder="输入食物名称自动查询营养">
    <button onclick="searchFoodLib()">查询（默认100g）</button>
    <div id="foodSearchResult"></div>
  </div>
  <div class="card">
    <h3>自定义食物录入</h3>

      <input id="cusName" placeholder="食物名">

    <div class="row">

function calcAutoPlan(){
  const gender = document.getElementById('genAuto').value;
  const h = Number(document.getElementById('heightAuto').value);
  const w = Number(document.getElementById('weightAuto').value);
  const age = Number(document.getElementById('ageAuto').value);
  const act = Number(document.getElementById('actAuto').value);
  if(!h||!w||!age){
    alert("请完整填写身高、体重、年龄");
    return;
  }
  const bmi = w / ((h/100)*(h/100));
  let BMR;
  if(gender==='male'){
    BMR = 10*w + 6.25*h -5*age +5;
  }else{
    BMR = 10*w + 6.25*h -5*age -161;
  }
  const TDEE = BMR * act;
  const targetCal = TDEE - 500;
  const pro = 2.0 * w;
  const fat = 0.8 * w;
  const proKcal = pro *4;
  const fatKcal = fat *9;
  const carbKcal = targetCal - proKcal - fatKcal;
  let carb = carbKcal /4;
  if(carb<80) carb=80;
  const carbTrain = carb +25;

  let diet,train;
  if(bmi >= 28){
    diet = dietSet.big;
    train = trainSet.big;
  }else if(bmi >=24){
    diet = dietSet.mid;
    train = trainSet.mid;
  }else{
    diet = dietSet.slim;
    train = trainSet.slim;
  }

  let dayText = diet.title + "\n";
  diet.days.forEach(d=> dayText += d+"\n");

  const resultText = `【基础代谢 & 目标】
BMI：${bmi.toFixed(2)}
BMR：${BMR.toFixed(0)} kcal
每日消耗TDEE：${TDEE.toFixed(0)} kcal
减脂目标摄入：${targetCal.toFixed(0)} kcal

🎯宏量营养素目标
休息日：蛋白${pro.toFixed(1)}g｜碳水${carb.toFixed(1)}g｜脂肪${fat.toFixed(1)}g
训练日：蛋白${pro.toFixed(1)}g｜碳水${carbTrain.toFixed(1)}g｜脂肪${fat.toFixed(1)}g

🍽${dayText}

${train}

💡备注：
1.7天循环轮换，一轮结束重新从Day1开始
2.烹饪少油，蔬菜不限量（淀粉类蔬菜算主食）
3.每日饮水2000~2500ml，禁止含糖饮料
4.食物可以同类互换（米饭↔红薯↔玉米，鸡胸↔牛腱↔巴沙鱼）`;
  document.getElementById('planResult').innerText = resultText;
  window.generatedMacro = {pro,cho:carb,fat};
}

function applyPlanMacro(){
  if(!window.generatedMacro){
    alert("请先生成计划！");
    return;
  }
  appData.macroTarget.pro = window.generatedMacro.pro;
  appData.macroTarget.cho = window.generatedMacro.cho;
  appData.macroTarget.fat = window.generatedMacro.fat;
  saveData();
  alert("✅营养素目标已应用！");
  renderMacroInput();
}

function saveData(){
  localStorage.setItem('fatAppData',JSON.stringify(appData));
}
function renderMacroInput(){
  document.getElementById('targetPro').value = appData.macroTarget.pro.toFixed(1);
  document.getElementById('targetCho').value = appData.macroTarget.cho.toFixed(1);
  document.getElementById('targetFat').value = appData.macroTarget.fat.toFixed(1);
}
function saveMacroTarget(){
  appData.macroTarget.pro = Number(document.getElementById('targetPro').value);
  appData.macroTarget.cho = Number(document.getElementById('targetCho').value);
  appData.macroTarget.fat = Number(document.getElementById('targetFat').value);
  saveData();
  alert("已保存宏量目标");
}
function calcBmiFat(){
  let h = Number(document.getElementById('setHeight').value)/100;
  let w = Number(document.getElementById('setWeight').value);
  let waist = Number(document.getElementById('setWaist').value);
  let hip = Number(document.getElementById('hipInput').value);
  let gender = document.getElementById('genderSelect').value;
  let bmi = w/(h*h);
  let fatRate;
  if(document.getElementById('fatFormula').value==='navy'){
    if(gender==='male') fatRate = 495/(1.0324-0.19077*Math.log10(waist-hip)+0.15456*Math.log10(h*100)) -450;
    else fatRate = 495/(1.29579-0.35004*Math.log10(waist+hip)+0.22100*Math.log10(h*100)) -450;
  }else{
    if(gender==='male') fatRate = 1.20*bmi +0.23*25 -16.2;
    else fatRate = 1.20*bmi +0.23*25 -5.4;
  }
  document.getElementById('bmiFatResult').innerText = `BMI:${bmi.toFixed(2)}，估算体脂率：${fatRate.toFixed(1)}%`;
}

function searchFoodLib(){
  let name = document.getElementById('searchFood').value.trim();
  let find = appData.foodLib.find(x=>x.name.includes(name)) || appData.customFood.find(x=>x.name.includes(name));
  if(!find){document.getElementById('foodSearchResult').innerText="未找到";return;}
  document.getElementById('foodSearchResult').innerText = `${find.name}(每100g) 热量:${find.kcal}kcal 蛋白${find.pro}g 碳水${find.cho}g 脂肪${find.fat}g`;
}
function addCustomFood(){
  let obj={
    name:document.getElementById('cusName').value,
    kcal:Number(document.getElementById('cusKcal').value),
    pro:Number(document.getElementById('cusPro').value),
    cho:Number(document.getElementById('cusCho').value),
    fat:Number(document.getElementById('cusFat').value)
  };
  appData.customFood.push(obj);saveData();renderCustomFood();
}
function renderCustomFood(){
  let html = "";
  appData.customFood.forEach((item,i)=>{
    html +=`<div>${item.name} <button class="del" onclick="delCusFood(${i})">删除</button></div>`
  })
  document.getElementById('customFoodList').innerHTML=html;
}
function delCusFood(idx){
  appData.customFood.splice(idx,1);saveData();renderCustomFood();
}

function addFoodItem(){
  let fdName = document.getElementById('foodName').value;
  let gram = Number(document.getElementById('foodGram').value);
  let fd = appData.foodLib.find(x=>x.name===fdName) || appData.customFood.find(x=>x.name===fdName);
  if(!fd){alert("食物不存在，请先在食物库录入");return;}
  let ratio = gram/100;
  todayFood.push({name:fdName,g:gram,kcal:fd.kcal*ratio,pro:fd.pro*ratio,cho:fd.cho*ratio,fat:fd.fat*ratio});
  renderTodayFood();
}
function renderTodayFood(){
  let html="";
  let sumK=0,sumP=0,sumC=0,sumF=0;
  todayFood.forEach((it,i)=>{
    html +=`<div>${it.name} ${it.g}g | ${it.kcal.toFixed(0)}kcal 蛋白${it.pro.toFixed(1)} 碳水${it.cho.toFixed(1)} 脂肪${it.fat.toFixed(1)}
    <button class="del" onclick="todayFood.splice(${i},1);renderTodayFood();">删除</button></div>`;
    sumK+=it.kcal;sumP+=it.pro;sumC+=it.cho;sumF+=it.fat;
  })
  document.getElementById('todayFoodList').innerHTML=html;
  let tPro = appData.macroTarget.pro;
  let tCho = appData.macroTarget.cho + (document.getElementById("isTrainDay").checked ? 25 :0);
  let tFat = appData.macroTarget.fat;
  document.getElementById('macroSummary').innerHTML = `
  <div>✅已摄入：热量${sumK.toFixed(0)}kcal｜蛋白${sumP.toFixed(1)}g｜碳水${sumC.toFixed(1)}g｜脂肪${sumF.toFixed(1)}g</div>
  <div>🎯目标：蛋白${tPro.toFixed(1)}g｜碳水${tCho.toFixed(1)}g｜脂肪${tFat.toFixed(1)}g</div>
  <div>📊差值：蛋白${(sumP-tPro).toFixed(1)}g｜碳水${(sumC-tCho).toFixed(1)}g｜脂肪${(sumF-tFat).toFixed(1)}g</div>
  `;
}

function saveDayRecord(){
  let rec = {
    date:new Date().toLocaleDateString(),
    weight:document.getElementById('todayWeight').value,
    waist:document.getElementById('todayWaist').value,
    isTrain:document.getElementById('isTrainDay').checked,
    water:document.getElementById('waterToday').value,
    foods:[...todayFood]
  };
  appData.records.push(rec);
  saveData();renderHistory();renderChart();
  alert("保存成功");
}
function renderHistory(){
  let html="";
  appData.records.forEach((r,i)=>{
    html +=`<div class="history-item" onclick="showRecDetail(${i})">${r.date} 体重:${r.weight}kg ${r.isTrain?"训练日":"休息日"}</div>`
  })
  document.getElementById('historyList').innerHTML=html;
}
function showRecDetail(i){
  let r = appData.records[i];
  let foodText = r.foods.map(x=>`${x.name} ${x.g}g`).join("\n");
  alert(`日期${r.date}\n体重${r.weight}kg\n腰围${r.waist}\n饮水量${r.water}\n食物清单:\n${foodText}`);
}

let weightChart;
function renderChart(){
  const ctx = document.getElementById('weightChart').getContext('2d');
  const labels = appData.records.map(r=>r.date);
  const wData = appData.records.map(r=>Number(r.weight));
  if(weightChart) weightChart.destroy();
  weightChart = new Chart(ctx,{
    type:"line",
    data:{labels:labels,datasets:[{label:"体重kg",data:wData,borderColor:"#2277dd",fill:false}]}
  })
}

renderMacroInput();
renderCustomFood();
renderHistory();
renderChart();
</script>
</body>
</html>
